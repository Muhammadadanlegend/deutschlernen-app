<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprich mit Anna – Deutsch A1</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--tx:#1f2328;--mut:#6b7280;--me:#2563eb;--bd:#e5e7eb;--acc:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#202327;--tx:#eceef1;--mut:#9aa1ab;--bd:#33373d;--me:#3b82f6}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}
label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:4px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.b{max-width:85%;padding:10px 13px;border-radius:16px;background:var(--card);border:1px solid var(--bd);align-self:flex-start}
.b.me{align-self:flex-end;background:var(--me);color:#fff;border-color:transparent}
.b .de{font-size:19px;font-weight:500}
.b .tr{font-size:14px;color:var(--mut);margin-top:6px;display:none}
.b.show .tr{display:block}
.fix{font-size:14px;margin-top:8px;padding:6px 8px;border-radius:8px;background:rgba(220,38,38,.1)}
.b.me .fix{background:rgba(255,255,255,.95);color:#1f2328}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sys{align-self:center;color:var(--mut);font-size:14px;text-align:center;max-width:520px}
.sys input{width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
#bar{padding:10px 12px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center}
#txt{flex:1;padding:11px 13px;border-radius:22px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;min-width:0}
button{font:inherit;border:0;border-radius:50%;width:48px;height:48px;background:var(--me);color:#fff;cursor:pointer;flex:none}
.mini{width:auto;height:auto;border-radius:14px;padding:5px 10px;font-size:13px;background:transparent;color:var(--tx);border:1px solid var(--bd)}
#mic.on{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
#start{border-radius:24px;width:auto;padding:0 22px;height:50px;font-size:17px;margin-top:10px}
</style></head>
<body>
<header><h1>🇩🇪 Anna – Deutsch A1</h1>
<label><input type="checkbox" id="auto" checked> Anna spricht</label>
<label><input type="checkbox" id="slow" checked> langsam</label>
<button class="mini" id="cfg">⚙️</button></header>
<div id="chat"></div>
<div id="bar"><input id="txt" placeholder="Sag etwas auf Deutsch…" autocomplete="off"><button id="mic" title="Sprechen">🎤</button><button id="go" title="Senden">➤</button></div>
<script>
const $=id=>document.getElementById(id),chat=$("chat"),txt=$("txt"),mic=$("mic");
const hist=[];let busy=false,rec=null,voices=[],lastMe=null,started=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MODELS=["gemini-2.5-flash","gemini-3.5-flash","gemini-flash-latest"];
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function loadV(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("de"))}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function unlock(){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function say(t,r){try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";loadV();if(voices[0])u.voice=voices[0];u.rate=r;setTimeout(()=>speechSynthesis.speak(u),60)}catch(e){}}
function speak(t){if($("auto").checked)say(t,$("slow").checked?0.8:1)}
function add(cls,html){const d=document.createElement("div");d.className=cls.startsWith("sys")?cls:"b "+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function annaBubble(o){const d=add("",`<div class="de">${esc(o.de)}</div><div class="tr">${esc(o.tr)}</div><div class="acts"><button class="mini" data-a="t">🌐 Übersetzen</button><button class="mini" data-a="r">🔁 Nochmal</button><button class="mini" data-a="s">🐢 Langsam</button></div>`);
d.querySelector('[data-a="t"]').onclick=()=>d.classList.toggle("show");
d.querySelector('[data-a="r"]').onclick=()=>say(o.de,0.95);
d.querySelector('[data-a="s"]').onclick=()=>say(o.de,0.55)}
const RULES=`Du bist Anna, 28, aus Berlin, eine freundliche Deutsch-Gesprächspartnerin für einen Lerner auf Niveau A1 (Muttersprache Urdu). Regeln: Nur sehr einfaches A1-Deutsch, 1-2 kurze Sätze (max 15 Wörter), Gegenwart. Führe ein natürliches Gespräch: erzähle immer etwas kurz über dich (Name, Wohnort, Familie, Hobby, Essen, Tagesablauf, Wetter, Uhrzeit, Zahlen, Einkaufen, Arbeit) UND stelle genau eine einfache Frage an den Lerner. Wechsle die Themen regelmäßig, wiederhole dich nicht, bleib nicht bei "Wie geht es dir?". Die Nachricht des Lerners kommt oft aus einer Spracherkennung, die manchmal falsche Wörter erkennt: rate, was der Lerner auf Deutsch sagen wollte, und antworte darauf. Wenn die Nachricht Fehler hat (Grammatik, Wortwahl, Englisch/Urdu statt Deutsch), setze "fix" auf {"better":"der bessere, richtige deutsche Satz","why":"kurze Erklärung in Roman Urdu: was falsch war und was man stattdessen sagt"}; ist alles richtig, setze "fix" auf null. "tr" ist die Übersetzung deiner Antwort in Roman Urdu (lateinische Schrift). Antworte NUR als JSON: {"de":"...","tr":"...","fix":null}`;
async function callGemini(prompt){
  const key=store.get("gkey");if(!key)throw new Error("NOKEY");
  const list=store.get("gmodel")?[store.get("gmodel"),...MODELS]:MODELS;let err;
  for(const m of list){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.9}})});
    if(r.ok){const j=await r.json();const t=j.candidates&&j.candidates[0].content.parts.map(p=>p.text||"").join("");return JSON.parse(t.replace(/```json|```/g,"").trim())}
    err=r.status+" "+m;if(r.status===400||r.status===403)throw new Error("KEY "+r.status);if(r.status===429)throw new Error("LIMIT")}
  throw new Error("MODEL "+err)}
async function ask(userText){
  busy=true;const th=add("sys","Anna schreibt…");
  const log=hist.slice(-16).map(h=>(h.r==="u"?"Lerner: ":"Anna: ")+h.t).join("\n");
  const prompt=RULES+"\n\nBisheriges Gespräch:\n"+(log||"(noch nichts)")+"\n\n"+(userText?"Neue Nachricht des Lerners: "+userText:"Beginne das Gespräch mit einer Begrüßung und stelle dich kurz vor.")+"\n\nJSON:";
  try{const o=await callGemini(prompt);th.remove();hist.push({r:"a",t:o.de});
    if(o.fix&&o.fix.better&&lastMe){const f=document.createElement("div");f.className="fix";f.innerHTML=`✏️ <b>Besser:</b> ${esc(o.fix.better)}<br>${esc(o.fix.why)}`;lastMe.appendChild(f)}
    annaBubble(o);speak(o.de)}
  catch(e){const m=String(e.message);th.innerHTML=m==="LIMIT"?"Zu viele Anfragen. Ek minute ruko, phir dobara bhejo.":m.startsWith("KEY")?"API key ghalat hai. ⚙️ mein dobara paste karo.":m==="NOKEY"?"Pehle ⚙️ mein API key daalo.":"Fehler: "+m+" (⚙️ mein model ka naam badal kar dekho)"}
  busy=false}
function send(t){t=(t||txt.value).trim();if(!t||busy)return;txt.value="";lastMe=add("me",`<div class="de">${esc(t)}</div>`);hist.push({r:"u",t});ask(t)}
$("go").onclick=()=>{unlock();send()};txt.onkeydown=e=>{if(e.key==="Enter"){unlock();send()}};
mic.onclick=()=>{
  if(!SR){alert("Is browser mein voice input nahi hai. Chrome ya Edge use karo, ya type karo.");return}
  if(rec){rec.stop();return}
  speechSynthesis.cancel();unlock();rec=new SR();rec.lang="de-DE";rec.interimResults=true;rec.continuous=false;
  rec.onstart=()=>mic.classList.add("on");
  rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;txt.value=s};
  rec.onerror=e=>{if(e.error==="not-allowed")alert("Mic ki ijazat do (browser settings mein).")};
  rec.onend=()=>{mic.classList.remove("on");rec=null;if(txt.value.trim())send()};
  try{rec.start()}catch(e){rec=null}};
function setup(){
  chat.innerHTML=`<div class="sys"><b>Einstellungen</b><br>Google Gemini ki free API key yahan paste karo (aistudio.google.com/apikey se bina card ke milti hai). Key sirf tumhare browser mein save hoti hai.<input id="k" type="password" placeholder="API key" value="${esc(store.get("gkey"))}"><input id="m" placeholder="Model (optional) z.B. gemini-2.5-flash" value="${esc(store.get("gmodel"))}"><button id="start">${started?"Speichern":"Start"}</button></div>`;
  $("start").onclick=()=>{const k=$("k").value.trim();if(!k){$("k").focus();return}store.set("gkey",k);store.set("gmodel",$("m").value.trim());unlock();if(started){chat.innerHTML="";hist.forEach(h=>h.r==="a"?annaBubble({de:h.t,tr:""}):add("me",`<div class="de">${esc(h.t)}</div>`))}else{started=true;chat.innerHTML="";ask("")}}}
$("cfg").onclick=setup;
if(store.get("gkey")){chat.innerHTML='<div class="sys">Mic dabao aur Deutsch mein bolo.<br><button id="start">Start</button></div>';$("start").onclick=()=>{unlock();started=true;chat.innerHTML="";ask("")}}else setup();
</script></body></html>
